<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="playAgainContainer"></div>
    <div class="rpsPlayers">
        <div class="playerContainer">
            <div class="playerName">Human</div>
            <div class="rpsContainer">
                <button class="rpsButton" id="rock">Rock</button>            
                <button class="rpsButton" id="paper">Paper</button>
                <button class="rpsButton" id="scissors">Scissors</button>
            </div>
            <div class="scoreContainer">
                <div class="scoreTitle">Score</div>
                <div class="scoreNumber" id="humanScore"></div>
            </div>
        </div>
        <div class="playerContainer">
            <div class="playerName">Computer</div>
            <div class="rpsContainer"></div>
            <div class="scoreContainer">
                <div class="scoreTitle">Score</div>
                <div class="scoreNumber" id="computerScore"></div>
            </div>
        </div>
    </div>
    <div id="roundResult"></div>
</body>
<footer>Scissors by Tarae from <a href="https://thenounproject.com/browse/icons/term/scissors/" target="_blank" title="Scissors Icons">Noun Project</a> (CC BY 3.0)</footer>
</html>
