<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="directionsContainer">
        <h1>Rock Paper Scissors</h1>
        <h2>First player with a score of 5 wins!</h2>
    </div>
    <div id="playAgainContainer"></div>
    <div class="rpsPlayers">
        <div class="playerContainer">
            <div class="playerName">Human</div>
            <div class="rpsContainer">
                <button class="rpsButton" id="rock">
                    <span class="emojiWrapper">
                        <span class="emoji">&#9994;</span>
                    </span>
                    <p>Rock</p></button>            
                <button class="rpsButton" id="paper">
                    <span class="emojiWrapper">
                        <span class="emoji">&#9995;</span>
                    </span>
                    <p>Paper</p></button>
                <button class="rpsButton" id="scissors">
                    <span class="emojiWrapper">
                        <span class="emoji">&#9996;</span>
                    </span>
                    <p>Scissors</p></button>
            </div>
            <div class="scoreContainer">
                <div class="scoreTitle">Score</div>
                <div class="scoreNumber" id="humanScore"></div>
            </div>
        </div>
        <div class="playerContainer">
            <div class="playerName">Computer</div>
            <div class="rpsContainer" id="computerChoice"></div>
            <div class="scoreContainer">
                <div class="scoreTitle">Score</div>
                <div class="scoreNumber" id="computerScore"></div>
            </div>
        </div>
    </div>
    <div id="roundResult"></div>
</body>
</html>
